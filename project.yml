name: KangCharge
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  KangCharge:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Widget/WidgetViews.swift
    dependencies:
      - target: KangChargeWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge
        PRODUCT_NAME: Kang Charge
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/KangCharge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  KangChargeWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.widget
        PRODUCT_NAME: KangChargeWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/KangChargeWidget.entitlements
        SKIP_INSTALL: YES
  KangChargeiOS:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Common
      - Shared/MCPClient.swift
      - Shared/ChargerAPI.swift
      - Shared/Models.swift
    dependencies:
      - target: KangChargeiOSWidget
        embed: true
      - target: KangChargeWatch
        embed: true
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Kang Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge
        CFBundleURLTypes:
          - CFBundleURLSchemes: [kangcharge]
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOS/App/KangCharge.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge
        PRODUCT_NAME: Kang Charge
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KangChargeiOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Widget
      - iOS/Common
      - Shared/MCPClient.swift
      - Shared/ChargerAPI.swift
      - Shared/Models.swift
    info:
      path: iOS/Widget/Info.plist
      properties:
        CFBundleDisplayName: Kang Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widget/KangChargeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.widget
        PRODUCT_NAME: KangChargeWidget
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
  KangChargeWatch:
    type: application
    platform: watchOS
    sources:
      - Watch/App
      - iOS/Common
      - Shared/MCPClient.swift
      - Shared/ChargerAPI.swift
      - Shared/Models.swift
    dependencies:
      - target: KangChargeWatchWidget
        embed: true
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Kang Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge.watch
        ITSAppUsesNonExemptEncryption: false
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).kangcharge
        WKApplication: true
    entitlements:
      path: Watch/App/KangChargeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.watchkitapp
        PRODUCT_NAME: Kang Charge
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KangChargeWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Watch/Widget
      - iOS/Common
      - Shared/MCPClient.swift
      - Shared/ChargerAPI.swift
      - Shared/Models.swift
    info:
      path: Watch/Widget/Info.plist
      properties:
        CFBundleDisplayName: Kang Charge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        KCAppGroup: group.$(BUNDLE_ID_PREFIX).kangcharge.watch
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Widget/KangChargeWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_ID_PREFIX).kangcharge.watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.watchkitapp.widget
        PRODUCT_NAME: KangChargeWatchWidget
        CODE_SIGN_STYLE: $(IOS_CODE_SIGN_STYLE)
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SKIP_INSTALL: YES
