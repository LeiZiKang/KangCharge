name: KangCharge
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KangChargeCore:
    url: https://github.com/LeiZiKang/KangChargeCore.git
    from: "1.0.5"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      ENABLE_PREVIEWS: YES
schemes:
  KangCharge:
    build:
      targets:
        KangCharge: all
        KangChargeWidget: all
    run:
      config: Debug
targets:
  KangCharge:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: Widget/WidgetViews.swift
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
      - target: KangChargeWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.mac
        PRODUCT_NAME: SugarWatt
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/KangCharge.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  KangChargeWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: KangChargeCore
        product: KangChargeCore
      - package: KangChargeCore
        product: KangChargeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).kangcharge.mac.widget
        PRODUCT_NAME: KangChargeWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/KangChargeWidget.entitlements
        SKIP_INSTALL: YES
